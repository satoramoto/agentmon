name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # agentmon reads macOS process and memory data, so it is tested on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake test
